options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud secrets versions access latest --secret=GITHUB_TOKEN --project=juniper-crm-498215-p5 > /workspace/github_token
        gcloud secrets versions access latest --secret=ENTRA_CLIENT_ID --project=juniper-crm-498215-p5 > /workspace/entra_client_id
        gcloud secrets versions access latest --secret=ENTRA_TENANT_ID --project=juniper-crm-498215-p5 > /workspace/entra_tenant_id

  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        DOCKER_BUILDKIT=1 docker build \
          --secret id=github_token,src=/workspace/github_token \
          --build-arg VITE_ENTRA_CLIENT_ID=$(cat /workspace/entra_client_id) \
          --build-arg VITE_ENTRA_TENANT_ID=$(cat /workspace/entra_tenant_id) \
          -t us-central1-docker.pkg.dev/juniper-crm-498215-p5/juniper-crm/crm-app-staging \
          .

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - us-central1-docker.pkg.dev/juniper-crm-498215-p5/juniper-crm/crm-app-staging

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - gcloud
      - run
      - deploy
      - juniper-crm-staging
      - --image=us-central1-docker.pkg.dev/juniper-crm-498215-p5/juniper-crm/crm-app-staging
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --add-cloudsql-instances=juniper-crm-498215-p5:us-central1:juniper-dev
      - --set-env-vars=MYSQL_SOCKET_PATH=/cloudsql/juniper-crm-498215-p5:us-central1:juniper-dev,ENVIRONMENT=staging,KMS_GRAPH_TOKEN_KEY=projects/juniper-crm-498215-p5/locations/us-central1/keyRings/juniper-crm/cryptoKeys/graph-tokens
      - --set-secrets=JWT_SECRET=JWT_SECRET:latest,ENTRA_CLIENT_ID=ENTRA_CLIENT_ID:latest,ENTRA_TENANT_ID=ENTRA_TENANT_ID:latest,ENTRA_CLIENT_SECRET=ENTRA_CLIENT_SECRET:latest,MYSQL_USER=MYSQL_USER_STAGING:latest,MYSQL_PASSWORD=MYSQL_PASSWORD_STAGING:latest,MYSQL_DB=MYSQL_DB_STAGING:latest
      - --project=juniper-crm-498215-p5
